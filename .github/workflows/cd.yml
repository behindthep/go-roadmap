# пайплайн срабатывает только на теги v*.
name: "Continuous Deployment (Release & Docker)"

# Триггер: запускать строго при создании тегов версий (например, v1.0.0)
# ВРЕМЕННО ОТКЛЮЧЕНО (уберите '#' когда появится код и Dockerfile)
# on:
#   push:
#     tags:
#       - 'v*'

jobs:
  # Задача 1: Создание красивой страницы релиза на GitHub
  github-release:
    name: "Create GitHub Release Page"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Задача 2: Сборка Docker-образа (без отправки во внешнюю среду)
  docker-build:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    # Гарантирует порядок: Docker начнет собираться только ПОСЛЕ успешного создания страницы релиза
    needs: github-release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Настройка эмуляторов для сборки под разные архитектуры (например, amd64 и arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Настройка расширенного сборщика Docker (Buildx)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Локальная сборка Docker-образа
      - name: Build Docker Image Locally
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile # Убедитесь, что Dockerfile лежит в корне проекта
          push: false         # НЕ отправляем образ на внешние сервера (Docker Hub / GitHub Packages)
          tags: |
            my-go-app:latest
            my-go-app:${{ github.ref_name }}

